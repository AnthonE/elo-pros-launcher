[package]
name = "elo-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "The Elo Pros platform SDK: a player's identity and signatures through the launcher with no key in the game, plus the platform's HTTP API (friends and buddies, tickets, items, faces, leaderboards, payout files)."
repository = "https://github.com/AnthonE/elo-pros-launcher"
homepage = "https://elopros.com"
readme = "README.md"
keywords = ["gamedev", "ethereum", "sdk", "multiplayer", "launcher"]
categories = ["game-development", "api-bindings"]
# What ships: the library, the overlay it includes, the examples. The tests
# read sdk/testdata/, which lives beside this crate in the repo, not in it.
include = ["/src/**", "/elo_overlay.rs", "/examples/**", "/README.md", "/Cargo.toml"]

# Its own workspace, so it builds standalone wherever the folder is copied.
[workspace]

[features]
default = ["http"]
# The HTTP client (`Client`). Without it: the launcher overlay, the models,
# the signed texts and the payout file, with no network dependency at all.
http = ["dep:ureq", "dep:ring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
# Already in the tree under ureq's rustls; used for the picture's sha256.
ring = { version = "0.17", default-features = false, optional = true }

[[example]]
name = "friends"
required-features = ["http"]
