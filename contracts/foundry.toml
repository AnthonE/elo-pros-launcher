[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# ScryPact.propose hits stack-too-deep on the legacy pipeline
via_ir = true

# AUDIT-2026-07-25.md §4: "Zero invariant tests, two fuzz tests repo-wide."
# test/Invariants.t.sol is the answer; this is the budget it runs under.
# Modest on purpose — the gate is run before every broadcast, and a suite
# nobody waits for is a suite nobody runs. `fail_on_revert = false` because
# each handler bounds its own inputs and swallows only LEGITIMATE refusals
# (a cap, a clock, an empty vault); the ghost accounting is what catches a
# wrong one, not the revert count.
[invariant]
runs = 64
depth = 32
fail_on_revert = false
shrink_run_limit = 1000

# Robinhood Chain mainnet
[rpc_endpoints]
rhchain = "https://rpc.mainnet.chain.robinhood.com"
