# cargo-deny — the half of the dependency policy a test cannot check.
#
#   cargo install cargo-deny && cargo deny check
#
# `crates/elo-launcher/tests/supply_chain.rs` enforces what is readable from
# `Cargo.lock`: checksums, duplicates, the tree budget, exact pins. This file
# covers what needs an external database — published advisories — plus licences.

[advisories]
# Unmaintained advisories are checked over the WHOLE tree. `"workspace"` saw
# only direct dependencies, and most of this tree is transitive — fltk-sys
# alone pulls in its font stack — so an abandoned crate deep in it passed in
# silence. cargo-deny 2 has no warn level for these: one in scope fails the
# check. So each one already known is waived below by id, with what lifts it.
# A NEW one fails `cargo deny check` until someone reads it and decides —
# which is the point of running the check; it is not a build step, so an
# upstream's neglect is a decision for us and never an outage.
unmaintained = "all"
yanked = "deny"
ignore = [
    # rustls-pemfile is unmaintained; its parsing moved into rustls-pki-types'
    # `PemObject`. Lifts when elo-hive's SSL_CERT_FILE read moves there.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained — move the PEM read to rustls-pki-types PemObject" },
    # ttf-parser is unmaintained and has no patched version. It arrives through
    # fltk's text shaping, not by our choice. Lifts when fltk drops it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, transitive via fltk — lifts when fltk moves off it" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `deny` here means: if either of these ever appears in the tree, stop.
deny = [
    # A launcher does not need to run a shell, and this crate existing in the
    # tree would mean something decided it did.
    { name = "openssl-sys", reason = "TLS is rustls; a C openssl link is a platform build dependency we refuse" },
]

[licenses]
# Everything currently in the tree. A new licence is a decision, so an
# unlisted one fails rather than being waived by a catch-all.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's root list as data (`webpki-roots`, `webpki-root-certs`).
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io and nothing else. A git dependency has no version to pin and no
# checksum in the lock the way a registry crate does.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
