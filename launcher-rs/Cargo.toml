[workspace]
resolver = "2"
members = ["crates/elo-depot", "crates/elo-net", "crates/elo-hive", "crates/elo-launcher", "crates/elo-ui", "crates/elo-broker", "crates/elo-vault"]

# ── the dependency policy ────────────────────────────────────────────────────
#
# Operator, 2026-08-05: *"if anything like veersion lock because lost of npm
# type chain attacks recently."*
#
# Four controls, and the first is the one that actually stops the npm attack
# class. They are stated here because a policy nobody can find is not a policy.
#
# 1. `Cargo.lock` IS COMMITTED, and it pins the whole TRANSITIVE tree to exact
#    versions with a SHA-256 checksum each. This is the control. A registry
#    that serves different bytes for a version already published fails the
#    checksum and the build stops. Deleting this file is the supply-chain
#    regression, not editing a version number.
# 2. Every direct dependency is pinned `=x.y.z` below. A caret range lets a
#    compromised maintainer's next patch release in on the next `cargo update`;
#    an exact pin makes taking it a visible, reviewable diff.
# 3. The tree is kept SMALL on purpose and counted by a test
#    (`elo-launcher/tests/supply_chain.rs`). Every crate here is a crate whose
#    compromise is our compromise, so the count is a budget and not a metric.
#    ⚠ Raising the cap is a decision; do it in the same commit as the crate.
# 4. `deny.toml` runs `cargo deny check` — advisories, licences, and a ban on
#    duplicate versions of the same crate.
#
# What this does NOT buy, said plainly so nobody reasons from it: a pinned,
# checksummed dependency is still someone else's code running as you. The lock
# stops the bytes CHANGING under you. It does not make the bytes good.

[workspace.package]
# ⚠ THE PUBLISHED VERSION IS THE ONLY THING AN INSTALLED CLIENT COMPARES.
# `elo check` asks the origin for a version and holds it against the one
# compiled in here, so shipping a rebuild WITHOUT moving this number is
# invisible: every existing install reads equal and reports itself current.
# That is exactly how 0.1.0 sat on /download.html for five days and eighteen
# commits — the artifacts were stale and nothing could say so. Bump this in
# the same commit as any republish.
version = "0.6.8"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
# ── the windows ──────────────────────────────────────────────────────────────
# Operator, 2026-08-06: *"fltk it is"* — the toolkit chosen on the budget, not
# on taste. Measured the same day: fltk +15 packages, eframe/egui +402,
# iced +414, slint +531, against a tree of 96 and a cap of 110. Every pure-Rust
# toolkit is 4-5x the entire tree and would retire this budget rather than
# raise it. `docs/LAUNCHER.md` §10b2 carries the table and the trade.
#
# ⚠ LICENCE, and `cargo deny` CANNOT SEE THIS. Both crates declare MIT, which
# is the Rust binding; `fltk-sys` vendors the FLTK C++ library, which is the
# FLTK License — LGPL with exceptions. Exception 3 permits static linking with
# no source obligation and exception 4 waives shipping the licence text, so the
# only live requirement is that "programs must still identify their use of
# FLTK". That credit is in `crates/elo-ui/src/lib.rs` and a test asserts it,
# because a licence gate reading crate metadata will never fail for its absence.
fltk = "=1.5.23"
# ── the hive's speaking key ──────────────────────────────────────────────────
# `k256` + `bech32` are +13 packages and they are the clearest earned
# dependency in this workspace. `SDK.md` §2a already made this call in Python
# — *signing belongs in an audited library rather than in code written here* —
# and a hand-rolled BIP-340 with a subtly wrong nonce leaks the key silently.
# RustCrypto is the reputable pure-Rust answer; no C, no libsecp256k1 build.
bech32 = "=0.12.0"
getrandom = "=0.3.4"
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "ecdsa"] }
sha3 = { version = "=0.10.8", default-features = false }
scrypt = { version = "=0.11.0", default-features = false }
aes = { version = "=0.8.4", default-features = false }
ctr = { version = "=0.9.2", default-features = false }
# ── the recovery phrase, and keys that do not linger ─────────────────────────
# All four were already in the tree under `scrypt` and `k256`, so naming them
# is four edges and zero packages (`supply_chain.rs` proves it). BIP-39 is
# PBKDF2-HMAC-SHA512 and BIP-32 is HMAC-SHA512; `zeroize` is what `k256`
# already uses to wipe a key on drop, now on the bytes around it too.
hmac = { version = "=0.12.1", default-features = false }
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# ── the same account on Solana ───────────────────────────────────────────────
# Ed25519 signing is `ring`'s (declared below for TLS: BoringSSL's audited
# curve25519), and the one piece of field arithmetic a program address needs,
# the on-curve test, is `crypto-bigint`, already here under `k256`. Two edges,
# zero packages: `supply_chain.rs` proves it, and the ed25519 crates measured
# at +10 were never needed.
crypto-bigint = { version = "=0.5.5", default-features = false }

# ── speaking at all ──────────────────────────────────────────────────────────
# buzz binds an event's author to the NIP-42-authenticated CONNECTION
# (`meter/hive.py` §hive_publish, measured 2026-07-25), so a note carried over
# the house's socket is refused — silently. Posting therefore needs our own
# authenticated WebSocket, and this is the standard sync client.
#
# ⚠ Deliberately WITHOUT its own TLS feature. `rustls`/`webpki-roots` are
# declared here at the versions `ureq` already resolved, so the workspace links
# ONE TLS stack and one root store; letting tungstenite bring its own added a
# second copy of the CA bundle to the binary for nothing.
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.10"
# ── a root we stop trusting ──────────────────────────────────────────────────
# `elo_net::tls` drops distrusted CAs (eMudhra, October 2026). `ureq` takes a
# custom root list only as whole certificates, which `webpki-roots` does not
# carry; this is the same list from the same maintainers as certificates. +1
# package. `rustls-webpki` is already here under rustls; naming it is an edge,
# used to read a root's subject.
webpki-root-certs = "=1.0.10"
rustls-webpki = { version = "=0.103.16", default-features = false }
rustls-pemfile = "=2.2.0"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
# ── a passphrase that does not appear on the screen ──────────────────────────
# Asked directly rather than through `rpassword`, which is three packages to
# clear ECHO in a termios struct. This one is ALREADY in the tree (`getrandom`
# depends on it on unix), so declaring it here adds a dependency edge and zero
# packages — the budget is unmoved and `supply_chain.rs` proves it.
libc = "=0.2.189"
tempfile = "=3.24.0"
ureq = { version = "=3.1.2", default-features = false, features = ["rustls"] }
# ── tests only: a TLS relay on localhost ─────────────────────────────────────
# `elo-hive/tests/fake_relay.rs` makes a throwaway CA and a `localhost` cert
# at test time rather than committing one — a PEM private key in the tree is
# exactly what `deploy/hooks/pre-commit` exists to stop, fixture or not.
# `ring` is already here under rustls at this version, so this is a dev edge
# and zero packages.
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The keystore's KDF is scrypt at n = 2^18 on purpose, and unoptimised it takes
# seconds per unlock: a debug GUI waits on every passphrase and the vault's
# tests take minutes. Optimising just these crates in dev changes no behaviour.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3

# And in release too. The binary is built for size (`opt-level = "z"`), which
# is right for nearly all of it and wrong for the KDF: unlocking the keystore
# took 2.4 s in a shipped build and takes 1.3 s with these four built for
# speed (measured 2026-10-25), for a few kilobytes of binary.
[profile.release.package.sha2]
opt-level = 3
[profile.release.package.scrypt]
opt-level = 3
[profile.release.package.salsa20]
opt-level = 3
[profile.release.package.pbkdf2]
opt-level = 3
