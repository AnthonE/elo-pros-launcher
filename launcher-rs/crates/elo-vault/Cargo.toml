[package]
name = "elo-vault"
description = "the local account — Web3 Secret Storage V3, and the signer that reads it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# ⚠ NOTHING HERE IS HAND-ROLLED, and that is the reason every one of these
# exists. `vault.py` opens with the same paragraph: writing novel ECDSA or a
# novel KDF is how a key leaks silently, and the failure has no symptom until
# somebody else has your money. Each crate is RustCrypto, which is why the
# incremental cost is small — the tree already carries their shared halves
# through `k256` and `sha2`.
#
#   k256    secp256k1 + ECDSA (recoverable) — signing
#   sha3    keccak-256 — the EIP-191 digest and the V3 keystore MAC
#   scrypt  the V3 KDF at geth's "standard" work factor
#   aes/ctr AES-128-CTR — the V3 cipher
#   pbkdf2/hmac/sha2  BIP-39 seed and BIP-32 derivation — the recovery phrase
#   zeroize  wipes derived keys, decrypted bytes and the phrase on drop
#   libc     setrlimit/prctl — `harden.rs`, unix only
[dependencies]
elo-broker = { path = "../elo-broker" }
aes = { workspace = true }
ctr = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
k256 = { workspace = true }
pbkdf2 = { workspace = true }
scrypt = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
elo-broker = { path = "../elo-broker" }
tempfile = { workspace = true }
