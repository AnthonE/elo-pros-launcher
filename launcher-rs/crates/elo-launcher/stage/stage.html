<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elo Pros stage</title>
<link rel="stylesheet" href="/stage.css">
<script type="module" src="/stage.js"></script>
</head>
<body class="stage layout-corner">
  <div id="frame">
    <div id="body" aria-hidden="true"></div>
    <div id="plate"><span id="name"></span><span id="label"></span></div>
    <p id="quote"><b id="quote-from"></b><span id="quote-text"></span></p>
    <p id="caption" aria-live="polite"></p>
    <div id="card" hidden><b id="card-title"></b><span id="card-body"></span></div>
    <div id="brb" hidden><b id="brb-name"></b><span>back soon</span></div>
    <p id="hint" hidden></p>
  </div>
</body>
</html>
