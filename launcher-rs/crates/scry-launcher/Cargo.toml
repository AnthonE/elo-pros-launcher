[package]
name = "scry-launcher"
description = "the scry desktop client — install, verify, update and start a game's native build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "scry"
path = "src/main.rs"

# No argument-parsing crate on purpose. `clap` is excellent and it is also the
# single largest dependency this binary would have; a launcher CLI is a dozen
# verbs and a flag, and the dependency policy in the workspace manifest says
# the tree is a budget. Parsing lives in `args.rs` and is tested.
[dependencies]
scry-depot = { path = "../scry-depot" }
scry-hive = { path = "../scry-hive" }
scry-net = { path = "../scry-net" }
# The account lives behind one crate on purpose (`scry-vault`'s own module
# note): one crate holds keys and every other crate provably does not. The CLI
# asking for it does not weaken that — it is the same single door, opened from
# the half of this client that runs without a display.
scry-vault = { path = "../scry-vault" }
# For the `Signer` trait alone, so `scry account sign` goes through the SAME
# implementation the window does. A second signing path in the CLI is how the
# two halves start disagreeing about what they signed.
scry-broker = { path = "../scry-broker" }
serde_json = { workspace = true }
# `self-update` verifies a downloaded artifact against the sha256 the origin
# published before a byte of it goes near the install — the same crate the
# depot rules already link, so the budget is unmoved.
sha2 = { workspace = true }
# The inflate for the client's own tar.gz/zip artifacts. See the workspace
# manifest for the trade; the envelope walks live in `src/selfup.rs`.
miniz_oxide = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
