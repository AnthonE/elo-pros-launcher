# Build the macOS client on Apple hardware.
#
# ⚠ THIS FILE IS MIRRORED FROM the Elo Pros source repo (deploy/elo-pros-launcher/release.yml).
# Editing it here is overwritten by the next publish.
#
# Why this exists at all: Linux and Windows are cross-built on the origin box
# (mingw links the Windows half fine), but Apple's SDK is required to link a
# macOS binary and there is no legal way to have one on that box. So the Mac
# build happens on a Mac, and this is the only Mac we have.
#
# It builds BOTH architectures and `lipo`s them into one universal binary, so a
# downloader does not have to know whether their Mac is Intel or Apple Silicon.
#
# ⚠ The artifact is UNSIGNED AND UNNOTARIZED. We hold no Apple Developer
# certificate, so Gatekeeper will refuse it on first run until the user does
# right-click ▸ Open or clears the quarantine attribute. That is stated on the
# download page rather than papered over.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to (e.g. v0.2.0). Leave blank to build only."
        required: false
        default: ""
  push:
    tags: ["v*"]

# Read-only by default. The build job runs `cargo build`, which runs every
# dependency's build.rs; it holds no write token and no persisted checkout
# credential, so a compromised crate can poison only its own artifact. The
# upload is a separate job that checks nothing out and builds nothing.
#
# ⚠ Every `uses:` is pinned to a full commit sha, the tag in a comment. One job
# builds the binary players download and another holds a release-write token;
# a tag like `@v4` is whatever its owner points it at next, and a moved tag
# runs here with that job's reach. Bumping one is a reviewed diff
# (deploy/test_release_workflow.py).
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14          # Apple Silicon; cross-builds the x86_64 half too
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Add both Apple targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version && cmake --version | head -1

      - name: Build and package the universal tarball
        run: python3 launcher-rs/build_release.py --macos

      # The tarball lands in watchtower/dl/ because build_release.py writes
      # relative to the repo root. Only the tarball is taken: the SHA256SUMS it
      # writes alongside covers just this one file, and the real one is rebuilt
      # on the origin from the whole directory once all three artifacts are in.
      - name: Name what was built
        id: art
        run: |
          f=$(ls watchtower/dl/elo-*-macos-universal.tar.gz)
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$f"
          tar -tzf "$f"

      - name: Prove the binary is actually universal
        run: |
          tar -xzf "${{ steps.art.outputs.path }}" -C /tmp
          d=/tmp/$(basename "${{ steps.art.outputs.name }}" .tar.gz)
          # ⚠ Only the CLI sits at the tarball root. Since 2026-08-21 the GUI
          # ships INSIDE a .app bundle — a bare Mach-O cannot register the
          # `elo://` scheme, because CFBundleURLTypes lives in Info.plist. The
          # directory name is APP_NAME in build_release.py and it has a SPACE
          # in it, so every use of it here is quoted.
          cli="$d/elo"
          gui="$d/Elo Pros.app/Contents/MacOS/elo-gui"
          test -f "$d/Elo Pros.app/Contents/Info.plist" \
            || { echo "FAIL no Info.plist — the .app did not survive packaging" >&2; exit 1; }
          file "$cli" "$gui"
          # A universal binary reports both arches. If lipo prints one, the
          # fuse silently produced a single-arch file and half the Macs that
          # download this would get an executable that cannot run.
          for b in "$cli" "$gui"; do
            archs=$(lipo -archs "$b")
            case "$archs" in
              *arm64*x86_64*|*x86_64*arm64*) echo "ok  $(basename "$b"): $archs" ;;
              *) echo "FAIL $(basename "$b") is not universal: $archs" >&2; exit 1 ;;
            esac
          done

      - name: Smoke the CLI on the runner
        run: |
          d=/tmp/$(basename "${{ steps.art.outputs.name }}" .tar.gz)
          "$d/elo" --version || "$d/elo" version || true
          # Non-fatal: the point of the run above is that the binary LOADS on
          # macOS — which is the one thing no cross-build could ever tell us.

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-universal
          path: ${{ steps.art.outputs.path }}
          if-no-files-found: error

  attach:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-universal
          path: dist
      - name: Attach to the release
        # The tag reaches the shell as an env var, never as `${{ }}` text, and
        # must look like a release tag before anything is uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-$GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?'; then
            echo "refusing: '$tag' is not a release tag (vMAJOR.MINOR.PATCH[-suffix])" >&2
            exit 1
          fi
          set -- dist/elo-*-macos-universal.tar.gz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one tarball in dist/" >&2; exit 1; }
          gh release upload "$tag" "$1" --clobber --repo "$GITHUB_REPOSITORY"
